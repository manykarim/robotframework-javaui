<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>javagui-spy</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --line: #d9dde3; --ink: #1c2430; --muted: #6b7686;
    --accent: #2563eb; --green: #16a34a; --amber: #d97706; --red: #dc2626; --hit: #2563eb;
    --hover: #eef2ff; --sel: #dbeafe;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 13px/1.4 -apple-system, Segoe UI, Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header .title { font-weight: 700; letter-spacing: .3px; }
  header .grow { flex: 1; }
  input[type=text] { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); }
  button { font: inherit; padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); cursor: pointer; }
  button:hover { background: var(--hover); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .badge { padding: 2px 8px; border-radius: 10px; font-weight: 700; font-size: 12px; white-space: nowrap; }
  .badge.green { background: #dcfce7; color: var(--green); }
  .badge.amber { background: #fef3c7; color: var(--amber); }
  .badge.red { background: #fee2e2; color: var(--red); }
  .badge.grey { background: #eceff3; color: var(--muted); }
  #locbar { flex: 1 1 340px; min-width: 200px; }
  main { display: grid; grid-template-columns: 300px 1fr 340px; height: calc(100vh - 50px); }
  .pane { overflow: auto; border-right: 1px solid var(--line); background: var(--panel); }
  .pane:last-child { border-right: none; }
  .pane h2 { margin: 0; padding: 8px 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 2; }
  .toolrow { display: flex; gap: 6px; padding: 8px; align-items: center; }
  .toolrow input { flex: 1; }
  /* tree */
  #tree { padding: 4px 0 40px; }
  .node { padding: 2px 8px 2px 6px; cursor: pointer; white-space: nowrap; display: flex; gap: 4px; align-items: baseline; }
  .node:hover { background: var(--hover); }
  .node.sel { background: var(--sel); }
  .node.hidden { display: none; }
  .node .ty { color: var(--accent); font-weight: 600; }
  .node .nm { color: var(--muted); }
  .node .tx { color: var(--ink); opacity: .8; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }
  .node .tw { display: inline-block; width: 1ch; color: var(--muted); }
  /* screenshot */
  #shotwrap { position: relative; margin: 8px; display: inline-block; }
  #shot { display: block; max-width: 100%; border: 1px solid var(--line); }
  #hoverbox, #selbox { position: absolute; pointer-events: none; border: 2px solid var(--hit); background: rgba(37,99,235,.10); display: none; }
  #selbox { border-color: var(--green); background: rgba(22,163,74,.10); }
  .hint { color: var(--muted); padding: 0 10px 10px; }
  /* inspector */
  .kv { width: 100%; border-collapse: collapse; }
  .kv td { padding: 3px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .kv td.k { color: var(--muted); width: 40%; white-space: nowrap; }
  .crumb { padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 3px; align-items: center; }
  .crumb a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .crumb a:hover { text-decoration: underline; }
  .crumb .sep { color: var(--muted); }
  .cand { border: 1px solid var(--line); border-radius: 8px; margin: 8px; padding: 8px; }
  .cand.uni { border-color: var(--green); }
  .cand .loc { font-family: ui-monospace, Menlo, monospace; font-size: 12px; word-break: break-all; margin-bottom: 6px; }
  .cand .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
  .cand .btns { display: flex; gap: 6px; }
  .flag { background: #fef3c7; color: var(--amber); padding: 1px 6px; border-radius: 8px; font-size: 11px; }
  .empty { padding: 14px 10px; color: var(--muted); }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #1c2430; color: #fff; padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
  #toast.show { opacity: .95; }
</style>
</head>
<body>
<header>
  <span class="title">javagui-spy</span>
  <input id="locbar" type="text" placeholder="locator, e.g. JButton[text='Save']" autocomplete="off">
  <span id="locbadge" class="badge grey">idle</span>
  <button id="copyrf">Copy as RF ▾</button>
  <button id="exportrf">Export RF resource</button>
  <span class="grow"></span>
  <span id="ts" class="hint" style="padding:0"></span>
  <button id="refresh">Refresh</button>
</header>
<main>
  <section class="pane" id="leftpane">
    <h2>Widget Tree</h2>
    <div class="toolrow">
      <input id="filter" type="text" placeholder="filter type / name / text…" autocomplete="off">
      <label style="color:var(--muted)"><input type="checkbox" id="showall"> all</label>
    </div>
    <div id="tree"></div>
  </section>
  <section class="pane" id="centerpane">
    <h2>Screenshot — hover to inspect, click to pick</h2>
    <div id="shotwrap">
      <img id="shot" alt="app screenshot">
      <div id="hoverbox"></div>
      <div id="selbox"></div>
    </div>
    <div class="hint">Click a point to hit-test the deepest widget there.</div>
  </section>
  <section class="pane" id="rightpane">
    <h2>Inspector</h2>
    <div id="crumb" class="crumb"></div>
    <table class="kv" id="props"></table>
    <h2 style="margin-top:4px">Candidates</h2>
    <div id="cands"><div class="empty">Select a widget to see ranked locators.</div></div>
  </section>
</main>
<div id="toast"></div>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const state = { tree: [], byId: new Map(), selId: null, shotNat: {w:0,h:0}, picked: [] };

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1400);
}
async function api(path, opts) {
  const r = await fetch(path, opts);
  const ct = r.headers.get("content-type") || "";
  if (ct.includes("application/json")) return r.json();
  return r;
}

/* ---------------- tree ---------------- */
async function loadTree() {
  const all = $("#showall").checked ? 1 : 0;
  const env = await api(`/api/tree?all=${all}`);
  if (!env.ok) { toast("tree error"); return; }
  state.tree = env.data; state.byId = new Map();
  for (const n of env.data) state.byId.set(n.node_id, n);
  renderTree();
  const ts = env.meta && env.meta.tree_timestamp;
  if (ts) $("#ts").textContent = "tree @ " + new Date(ts).toLocaleTimeString();
}
function nodeLabel(n) {
  const parts = [`<span class="ty">${esc(n.type||"?")}</span>`];
  if (n.name) parts.push(`<span class="nm">#${esc(n.name)}</span>`);
  if (n.text) parts.push(`<span class="tx">"${esc(n.text)}"</span>`);
  return parts.join(" ");
}
function renderTree() {
  const f = ($("#filter").value || "").toLowerCase();
  const box = $("#tree"); box.innerHTML = "";
  for (const n of state.tree) {
    const hay = `${n.type||""} ${n.name||""} ${n.text||""}`.toLowerCase();
    const hit = !f || hay.includes(f);
    const row = document.createElement("div");
    row.className = "node" + (hit ? "" : " hidden") + (n.node_id === state.selId ? " sel" : "");
    row.dataset.id = n.node_id;
    row.style.paddingLeft = (6 + (n.depth||0) * 12) + "px";
    row.innerHTML = `<span class="tw">${(n.depth||0) ? "·" : ""}</span>` + nodeLabel(n);
    row.onclick = () => selectNode(n.node_id, "tree");
    box.appendChild(row);
  }
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------------- selection ---------------- */
async function selectNode(id, src) {
  state.selId = id;
  document.querySelectorAll(".node").forEach(el =>
    el.classList.toggle("sel", Number(el.dataset.id) === id));
  if (src === "tree") {
    const el = document.querySelector(`.node[data-id='${id}']`);
    if (el) el.scrollIntoView({block: "nearest"});
  }
  await Promise.all([loadDescribe(id), loadSuggest(id)]);
}
async function loadDescribe(id) {
  const env = await api(`/api/describe?node_id=${id}`);
  const props = $("#props"), crumb = $("#crumb");
  props.innerHTML = ""; crumb.innerHTML = "";
  if (!env.ok) { props.innerHTML = `<tr><td class="empty">${esc(env.error?.message||"error")}</td></tr>`; return; }
  const d = env.data, t = d.target;
  const rows = [
    ["node_id", t.node_id], ["type", t.type], ["name", t.name || "—"],
    ["text", t.text || "—"], ["depth", t.depth],
    ["bounds", `${t.bounds.x},${t.bounds.y} ${t.bounds.w}×${t.bounds.h}`],
  ];
  const st = d.state || {};
  for (const k of ["visible", "enabled", "focused"]) if (k in st) rows.push([k, String(st[k])]);
  for (const [k, v] of rows)
    props.insertAdjacentHTML("beforeend", `<tr><td class="k">${esc(k)}</td><td>${esc(v)}</td></tr>`);
  // breadcrumb (ancestors are root→…; append the target)
  const chain = (d.ancestors || []).concat([{node_id: t.node_id, type: t.type, name: t.name}]);
  chain.forEach((a, i) => {
    if (i) crumb.insertAdjacentHTML("beforeend", `<span class="sep">›</span>`);
    const lbl = esc(a.type || "?") + (a.name ? " #" + esc(a.name) : "");
    const link = document.createElement("a"); link.innerHTML = lbl;
    link.onclick = () => selectNode(a.node_id, "crumb");
    crumb.appendChild(link);
  });
  drawSelBox(t.bounds);
}
async function loadSuggest(id) {
  const strip = 0;
  const env = await api(`/api/suggest?node_id=${id}&strip_names=${strip}`);
  const box = $("#cands"); box.innerHTML = "";
  if (!env.ok) { box.innerHTML = `<div class="empty">${esc(env.error?.message||"error")}</div>`; return; }
  const cands = env.data.candidates || [];
  const snip = env.data.rf_snippets || {};
  if (!cands.length) { box.innerHTML = `<div class="empty">No unique locator found.</div>`; return; }
  cands.forEach((c, i) => {
    const uni = c.unique === true;
    const mc = c.match_count;
    const mcls = mc === 1 ? "green" : (mc === 0 ? "red" : "amber");
    const flags = (c.brittle_flags || []).map(f => `<span class="flag">${esc(f)}</span>`).join(" ");
    const div = document.createElement("div");
    div.className = "cand" + (uni ? " uni" : "");
    div.innerHTML =
      `<div class="loc">${esc(c.locator)}</div>` +
      `<div class="meta">` +
        `<span class="badge ${mcls}">${mc === null ? "?" : mc} match${mc === 1 ? "" : "es"}</span>` +
        `<span class="badge grey">score ${c.score}</span>` +
        `<span class="badge grey">stab ${c.stability}</span>` +
        `<span class="badge grey">${esc(c.strategy||"")}</span>` + flags +
      `</div>` +
      `<div class="btns">` +
        `<button data-a="copy">Copy</button>` +
        `<button data-a="use">Use ↑</button>` +
        `<button data-a="flash">Flash</button>` +
        `<button data-a="pick">＋ export</button>` +
      `</div>`;
    const rf = (snip.click) ? snip.click.replace(/\S.*$/, c.locator).replace("Click    ", "Click    ") : c.locator;
    div.querySelector('[data-a=copy]').onclick = () => { copy(`Click    ${c.locator}`); toast("RF snippet copied"); };
    div.querySelector('[data-a=use]').onclick = () => { $("#locbar").value = c.locator; validateLoc(); };
    div.querySelector('[data-a=flash]').onclick = () => flash(id);
    div.querySelector('[data-a=pick]').onclick = () => addPicked(c.locator);
    box.appendChild(div);
  });
}
async function flash(id) {
  await api("/api/highlight", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({node_id: id})});
  toast("flashed");
}

/* ---------------- screenshot ---------------- */
function loadShot() {
  const img = $("#shot");
  img.onload = () => { state.shotNat = {w: img.naturalWidth, h: img.naturalHeight};
                       if (state.selId != null) { const n = state.byId.get(state.selId); if (n) drawSelBox(n.bounds); } };
  img.src = "/api/screenshot?t=" + Date.now();
}
function toScreen(ev) {
  const img = $("#shot"), r = img.getBoundingClientRect();
  const sx = state.shotNat.w / r.width, sy = state.shotNat.h / r.height;
  return {x: Math.round((ev.clientX - r.left) * sx), y: Math.round((ev.clientY - r.top) * sy),
          scaleX: 1 / sx, scaleY: 1 / sy};
}
function placeBox(box, b, sc) {
  if (!b || b.x == null) { box.style.display = "none"; return; }
  box.style.display = "block";
  box.style.left = (b.x * sc.x) + "px"; box.style.top = (b.y * sc.y) + "px";
  box.style.width = (b.w * sc.x) + "px"; box.style.height = (b.h * sc.y) + "px";
}
function curScale() {
  const img = $("#shot"), r = img.getBoundingClientRect();
  return {x: r.width / (state.shotNat.w || 1), y: r.height / (state.shotNat.h || 1)};
}
function drawSelBox(b) { placeBox($("#selbox"), b, curScale()); }
$("#shot")?.addEventListener("mousemove", (ev) => {
  // hover over the tree-known node whose bounds contain the cursor (cheap client hit-test)
  const p = toScreen(ev); let best = null;
  for (const n of state.tree) {
    const b = n.bounds; if (!b || b.x == null) continue;
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
      if (!best || (b.w * b.h) < (best.bounds.w * best.bounds.h)) best = n;
    }
  }
  placeBox($("#hoverbox"), best ? best.bounds : null, curScale());
});
$("#shot")?.addEventListener("mouseleave", () => { $("#hoverbox").style.display = "none"; });
$("#shot")?.addEventListener("click", async (ev) => {
  const p = toScreen(ev);
  const env = await api("/api/pick", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({x: p.x, y: p.y})});
  if (env.ok && env.data.hit && env.data.hit.hit) {
    const id = env.data.hit.id;
    if (state.byId.has(id)) selectNode(id, "pick");
    else { toast("picked id " + id + " (not in tree — refresh)"); }
  } else toast("no widget at point");
});

/* ---------------- locator bar ---------------- */
let locTimer = null;
$("#locbar").addEventListener("input", () => {
  clearTimeout(locTimer); locTimer = setTimeout(validateLoc, 250);
});
async function validateLoc() {
  const loc = $("#locbar").value.trim();
  const badge = $("#locbadge");
  if (!loc) { badge.className = "badge grey"; badge.textContent = "idle"; return; }
  const expect = state.selId != null ? `&expect_id=${state.selId}` : "";
  let env;
  try { env = await api(`/api/validate?locator=${encodeURIComponent(loc)}${expect}`); }
  catch (e) { badge.className = "badge red"; badge.textContent = "error"; return; }
  if (!env.ok && env.error) { badge.className = "badge red"; badge.textContent = env.error.code || "error"; return; }
  const d = env.data, mc = d.match_count;
  if (mc === 1) { badge.className = "badge green"; badge.textContent = "1 of 1"; }
  else if (mc === 0) { badge.className = "badge red"; badge.textContent = "0 matches"; }
  else { badge.className = "badge amber"; badge.textContent = "1 of " + mc; }
  if (mc >= 1 && d.matches && d.matches[0] && state.byId.has(d.matches[0].node_id))
    drawSelBox(d.matches[0].bounds);
}
$("#copyrf").onclick = () => {
  const loc = $("#locbar").value.trim(); if (!loc) { toast("locator bar empty"); return; }
  copy(`Click    ${loc}`); toast("Copied: Click    " + loc);
};

/* ---------------- export RF resource ---------------- */
function addPicked(locator) {
  const n = state.byId.get(state.selId);
  const base = (n && (n.name || n.text || n.type) || "WIDGET").toUpperCase().replace(/[^A-Z0-9]+/g, "_").replace(/^_|_$/g, "");
  let name = base || "WIDGET", i = 2;
  while (state.picked.some(p => p.name === name)) name = base + "_" + (i++);
  state.picked.push({name, locator});
  toast(`added ${name} (${state.picked.length} picked)`);
}
$("#exportrf").onclick = () => {
  if (!state.picked.length) { toast("no candidates picked — use ＋ export on a candidate"); return; }
  const lines = ["*** Variables ***"];
  for (const p of state.picked) lines.push(`\${${p.name}}    ${p.locator}`);
  const blob = new Blob([lines.join("\n") + "\n"], {type: "text/plain"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "locators.resource";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(`exported ${state.picked.length} locators`);
};
function copy(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(fallbackCopy.bind(null, text));
  else fallbackCopy(text);
}
function fallbackCopy(text) {
  const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
  ta.select(); try { document.execCommand("copy"); } catch (e) {} ta.remove();
}

/* ---------------- events + wiring ---------------- */
$("#filter").addEventListener("input", renderTree);
$("#showall").addEventListener("change", loadTree);
$("#refresh").onclick = () => { loadTree(); loadShot(); };
function subscribe() {
  try {
    const es = new EventSource("/events");
    es.addEventListener("change", () => { loadTree(); loadShot(); });
    es.onerror = () => { es.close(); setTimeout(subscribe, 2000); };
  } catch (e) { /* SSE unsupported — Refresh still works */ }
}
loadTree(); loadShot(); subscribe();
</script>
</body>
</html>
