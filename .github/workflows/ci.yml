name: CI

on:
  push:
  pull_request:

jobs:
  # Fast anti-drift check for the agent-facing docs: tool pointers resolve to AGENTS.md,
  # no dead relative links in the canonical docs, and the generated keyword reference exists.
  doc-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Doc-lint (agent docs)
        run: python scripts/doc_lint.py

  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        python: ["3.10", "3.12", "3.14"]
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v2
        with:
          version: latest

      - name: Setup Python (primary, via uv)
        id: setup_python_primary
        run: uv python install ${{ matrix.python }}
        continue-on-error: ${{ matrix.python == '3.14' }}

      - name: Setup Python (fallback to 3.13, via uv)
        if: ${{ matrix.python == '3.14' && steps.setup_python_primary.outcome == 'failure' }}
        run: uv python install 3.13

      - name: Show uv and Python versions
        run: |
          uv --version
          uv run python --version

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies (dev)
        run: uv sync --all-extras --group dev

      - name: Install build tools
        run: uv tool install maturin

      - name: Install Linux UI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgtk-3-0 \
            libglib2.0-0 \
            libx11-6 \
            libxext6 \
            libxrender1 \
            libxtst6 \
            libxi6 \
            libxrandr2 \
            libxcomposite1 \
            libxdamage1 \
            libxkbcommon0
          sudo apt-get install -y libasound2 || sudo apt-get install -y libasound2t64

      - name: Start Xvfb
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 > /tmp/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Build test apps (Swing/SWT/RCP-mock)
        if: runner.os != 'macOS'
        run: |
          cd tests/apps
          (cd swing && mvn clean package)
          (cd swt && mvn clean package)
          (cd rcp-mock && mvn clean package)

      - name: Build test apps (Swing/SWT/RCP-mock, macOS arm64)
        if: runner.os == 'macOS'
        run: |
          cd tests/apps
          (cd swing && mvn clean package)
          (cd swt && mvn clean package -Pswt-mac-arm64)
          (cd rcp-mock && mvn clean package -Pswt-mac-arm64)

      - name: Build full package (agent + wheel)
        run: uv run invoke build

      - name: Add Windows port tools to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value "$PWD\\scripts\\ci\\win-tools"

      - name: Diagnostic Swing app startup (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash scripts/ci/diagnostic-swing.sh

      - name: Diagnostic Swing app startup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/ci/diagnostic-swing.ps1

      - name: Diagnostic SWT app startup (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash scripts/ci/diagnostic-swt.sh

      - name: Diagnostic SWT app startup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/ci/diagnostic-swt.ps1

      - name: Cleanup test apps (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash scripts/ci/cleanup-test-apps.sh

      - name: Cleanup test apps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/ci/cleanup-test-apps.ps1

      - name: Smoke Robot Tests (Swing/SWT/RCP)
        if: runner.os != 'macOS'
        run: |
          uv run robot --outputdir tests/robot/output-smoke \
            tests/robot/swing/01_connection.robot \
            tests/robot/swt/01_connection.robot \
            tests/robot/rcp/01_connection.robot

      - name: Smoke Robot Tests (macOS only, no RCP)
        if: runner.os == 'macOS'
        run: |
          uv run robot --outputdir tests/robot/output-smoke \
            tests/robot/swing/01_connection.robot \
            tests/robot/swt/01_connection.robot

      - name: Run Robot Framework tests (incl. Swing/SWT/RCP)
        if: runner.os != 'macOS'
        run: uv run robot --outputdir tests/robot/output tests/robot/

      - name: Run Robot Framework tests (macOS only, no RCP)
        if: runner.os == 'macOS'
        run: uv run robot --outputdir tests/robot/output tests/robot/swing tests/robot/swt

      - name: Run Python tests
        run: uv run pytest tests/python/

      - name: Run spy tests (Linux, xvfb — drives the Swing app)
        if: runner.os == 'Linux'
        run: uv run pytest tests/spy/ -v

      - name: Upload Robot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-logs-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            tests/robot/output-smoke/**
            tests/robot/output/**
          if-no-files-found: warn

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            target/wheels/*.whl
            agent/target/*.jar
            python/JavaGui/jars/*.jar
          if-no-files-found: warn

  # Full RCP proof against a REAL public Eclipse RCP product (DBeaver Community
  # Edition), headless in Docker. The test application is downloaded during the
  # run (DBeaver + a full JDK are pulled into the harness image), the workbench
  # is driven with the agent, and the run leaves framebuffer screenshots.
  real-rcp-dbeaver:
    name: Real RCP (DBeaver) headless
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v2
        with:
          version: latest

      - name: Setup Python
        run: uv python install 3.12

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install build tools
        run: uv tool install maturin

      - name: Install dependencies (dev)
        run: uv sync --all-extras --group dev

      - name: Build agent + in-source Rust extension
        run: |
          uv run invoke build
          uv run maturin develop --release

      - name: Build harness image (downloads DBeaver + JDK)
        run: docker build -t rcp-dbeaver-harness tests/docker/rcp

      - name: Run + assert real DBeaver workbench suite (headless)
        run: |
          docker run --rm --shm-size=512m -v "$PWD":/work rcp-dbeaver-harness
          python3 tests/docker/rcp/assert_results.py

      - name: Run + assert real DBeaver widget suite (headless)
        run: |
          docker run --rm --shm-size=512m -e SUITE_DIR=/work/tests/robot/rcp/dbeaver_widgets -v "$PWD":/work rcp-dbeaver-harness
          python3 tests/docker/rcp/assert_results.py

      - name: Upload real RCP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-rcp-dbeaver-evidence
          path: |
            results/dbeaver/log.html
            results/dbeaver/report.html
            results/dbeaver/shots/**
            results/dbeaver/logs/**
          if-no-files-found: warn

  # Java Web Start (JNLP) proof, headless in Docker. Serves the sandbox JNLP
  # (tests/apps/jnlp, reusing the Swing test app), launches it with portable
  # IcedTea-Web, and drives the runtime dynamic-attach flow. HONEST scope: under
  # IcedTea-Web a JNLPSecurityManager structurally blocks attach, so this proves
  # launch + discover + the documented SecurityManager AttachError, not a green
  # attach (which needs OpenWebStart / JDK 24+). The Robot suite asserts that
  # either/or. Kept a separate job so it never blocks the build-test matrix.
  webstart-jnlp:
    name: Web Start (JNLP) headless
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v2
        with:
          version: latest

      - name: Setup Python
        run: uv python install 3.12

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install build tools
        run: uv tool install maturin

      - name: Install dependencies (dev)
        run: uv sync --all-extras --group dev

      - name: Build agent + in-source Rust extension
        run: |
          uv run invoke build
          uv run maturin develop --release

      - name: Build Swing test app
        run: (cd tests/apps/swing && mvn clean package)

      - name: Build harness image (downloads IcedTea-Web + JDK 17)
        run: docker build -t jnlp-harness tests/docker/jnlp

      - name: Run JNLP Web Start harness (headless)
        run: docker run --rm --shm-size=512m -v "$PWD":/work jnlp-harness

      - name: Upload Web Start evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webstart-jnlp-evidence
          path: |
            results/jnlp/log.html
            results/jnlp/report.html
            results/jnlp/output.xml
            results/jnlp/logs/**
          if-no-files-found: warn
